<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#caa24a"/>
      <stop offset="1" stop-color="#f2d98a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1440" height="1020" fill="url(#bg1)"/>
  <!-- faint dormant grid awakening -->
  <g opacity="0.08">
    <g stroke="#5a6b9a">
      <line x1="0" y1="170" x2="1440" y2="170"/><line x1="0" y1="510" x2="1440" y2="510"/>
      <line x1="0" y1="850" x2="1440" y2="850"/>
      <line x1="480" y1="0" x2="480" y2="1020"/><line x1="960" y1="0" x2="960" y2="1020"/>
    </g>
  </g>

  <!-- HEADER -->
  <text x="70" y="92" fill="#7f8db8" font-size="20" letter-spacing="6" font-family="Verdana, sans-serif">MOOD BOARD · BLOG 01 — STRATEGIC</text>
  <text x="70" y="150" fill="#f4f6ff" font-size="58" font-weight="bold">The 402 Moment</text>
  <text x="70" y="190" fill="url(#gold)" font-size="24" font-style="italic">The dormant status code wakes up to an economy of machines.</text>
  <text x="1370" y="150" fill="#3ddc97" font-size="120" font-weight="bold" text-anchor="end" font-family="Verdana, sans-serif" opacity="0.92">402</text>

  <line x1="70" y1="222" x2="1370" y2="222" stroke="#2a3457" stroke-width="1.5"/>

  <!-- TONE KEYWORDS -->
  <g font-family="Verdana, sans-serif">
    <text x="70" y="270" fill="#7f8db8" font-size="16" letter-spacing="4">TONE &amp; FEELING</text>
    <g font-size="19">
      <rect x="70" y="288" width="190" height="44" rx="22" fill="none" stroke="#caa24a"/>
      <text x="165" y="316" fill="#f2d98a" text-anchor="middle">Authoritative</text>
      <rect x="276" y="288" width="170" height="44" rx="22" fill="none" stroke="#3ddc97"/>
      <text x="361" y="316" fill="#9ff0c8" text-anchor="middle">Inevitable</text>
      <rect x="462" y="288" width="150" height="44" rx="22" fill="none" stroke="#6f8bd6"/>
      <text x="537" y="316" fill="#aebde8" text-anchor="middle">Editorial</text>
      <rect x="628" y="288" width="210" height="44" rx="22" fill="none" stroke="#caa24a"/>
      <text x="733" y="316" fill="#f2d98a" text-anchor="middle">Quietly futuristic</text>
      <rect x="854" y="288" width="180" height="44" rx="22" fill="none" stroke="#3ddc97"/>
      <text x="944" y="316" fill="#9ff0c8" text-anchor="middle">Boardroom-calm</text>
    </g>
  </g>

  <!-- COLOR PALETTE -->
  <g font-family="Verdana, sans-serif">
    <text x="70" y="392" fill="#7f8db8" font-size="16" letter-spacing="4">PALETTE — "midnight ledger, awakened in gold &amp; signal-green"</text>
    <g>
      <rect x="70" y="410" width="150" height="150" rx="6" fill="#0a1024"/>
      <text x="80" y="582" fill="#aab4d4" font-size="14">Ink Navy</text><text x="80" y="600" fill="#67739c" font-size="12">#0A1024</text>
      <rect x="232" y="410" width="150" height="150" rx="6" fill="#121a36"/>
      <text x="242" y="582" fill="#aab4d4" font-size="14">Deep Slate</text><text x="242" y="600" fill="#67739c" font-size="12">#121A36</text>
      <rect x="394" y="410" width="150" height="150" rx="6" fill="#3ddc97"/>
      <text x="404" y="582" fill="#aab4d4" font-size="14">Signal Green</text><text x="404" y="600" fill="#67739c" font-size="12">#3DDC97</text>
      <rect x="556" y="410" width="150" height="150" rx="6" fill="url(#gold)"/>
      <text x="566" y="582" fill="#aab4d4" font-size="14">Awakened Gold</text><text x="566" y="600" fill="#67739c" font-size="12">#CAA24A</text>
      <rect x="718" y="410" width="150" height="150" rx="6" fill="#2775ca"/>
      <text x="728" y="582" fill="#aab4d4" font-size="14">USDC Blue</text><text x="728" y="600" fill="#67739c" font-size="12">#2775CA</text>
      <rect x="880" y="410" width="150" height="150" rx="6" fill="#f4f6ff"/>
      <text x="890" y="582" fill="#aab4d4" font-size="14">Paper White</text><text x="890" y="600" fill="#67739c" font-size="12">#F4F6FF</text>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g>
    <text x="70" y="668" fill="#7f8db8" font-size="16" letter-spacing="4" font-family="Verdana, sans-serif">TYPOGRAPHY</text>
    <text x="70" y="716" fill="#f4f6ff" font-size="40">Serif headlines — gravitas &amp; trust</text>
    <text x="70" y="744" fill="#9aa6cc" font-size="17" font-style="italic">Georgia / Tiempos / Source Serif · for titles and pull quotes</text>
    <text x="70" y="792" fill="#f4f6ff" font-size="22" font-family="Verdana, sans-serif">Sans body &amp; labels — modern, neutral, scannable</text>
    <text x="70" y="818" fill="#9aa6cc" font-size="15" font-family="Verdana, sans-serif">Inter / Söhne / Verdana · for body, captions, UI</text>
    <text x="70" y="858" fill="#3ddc97" font-size="20" font-family="'Courier New', monospace">402 · USDC · per-call · machine-payable</text>
    <text x="70" y="880" fill="#67739c" font-size="13" font-family="Verdana, sans-serif">Mono accent · used sparingly to signal "this is protocol, not prose"</text>
  </g>

  <!-- MOTIF PANEL -->
  <g>
    <rect x="1058" y="288" width="312" height="640" rx="10" fill="#0d1530" stroke="#2a3457"/>
    <text x="1214" y="324" fill="#7f8db8" font-size="16" letter-spacing="4" text-anchor="middle" font-family="Verdana, sans-serif">VISUAL MOTIFS</text>

    <!-- dormant->lit switch -->
    <circle cx="1214" cy="430" r="64" fill="url(#glow)" filter="url(#soft)"/>
    <circle cx="1214" cy="430" r="44" fill="none" stroke="#3ddc97" stroke-width="3"/>
    <text x="1214" y="442" fill="#3ddc97" font-size="34" font-weight="bold" text-anchor="middle" font-family="Verdana, sans-serif">402</text>
    <text x="1214" y="520" fill="#9aa6cc" font-size="14" text-anchor="middle" font-family="Verdana, sans-serif">a reserved code, lit up</text>

    <!-- machine handshake: agent <-> server, coin between -->
    <g stroke="#caa24a" stroke-width="2.5" fill="none">
      <rect x="1098" y="566" width="58" height="58" rx="8"/>
      <rect x="1272" y="566" width="58" height="58" rx="8"/>
      <path d="M1156 595 H1198"/>
      <path d="M1272 595 H1230"/>
    </g>
    <circle cx="1214" cy="595" r="17" fill="url(#gold)"/>
    <text x="1214" y="600" fill="#0a1024" font-size="13" font-weight="bold" text-anchor="middle" font-family="Verdana, sans-serif">$</text>
    <text x="1127" y="650" fill="#9aa6cc" font-size="12" text-anchor="middle" font-family="Verdana, sans-serif">agent</text>
    <text x="1301" y="650" fill="#9aa6cc" font-size="12" text-anchor="middle" font-family="Verdana, sans-serif">API</text>
    <text x="1214" y="678" fill="#9aa6cc" font-size="14" text-anchor="middle" font-family="Verdana, sans-serif">machine-to-machine pay</text>

    <!-- rising market: tiny bars -->
    <g fill="#3ddc97" opacity="0.9">
      <rect x="1110" y="820" width="20" height="36"/>
      <rect x="1140" y="800" width="20" height="56"/>
      <rect x="1170" y="772" width="20" height="84"/>
      <rect x="1200" y="744" width="20" height="112"/>
      <rect x="1230" y="712" width="20" height="144"/>
      <rect x="1260" y="688" width="20" height="168"/>
      <rect x="1290" y="660" width="20" height="196"/>
    </g>
    <text x="1214" y="892" fill="#9aa6cc" font-size="14" text-anchor="middle" font-family="Verdana, sans-serif">the agentic market, growing</text>
  </g>

  <!-- IMAGERY DIRECTION -->
  <g font-family="Verdana, sans-serif">
    <line x1="70" y1="916" x2="1030" y2="916" stroke="#2a3457"/>
    <text x="70" y="950" fill="#7f8db8" font-size="16" letter-spacing="4">IMAGERY DIRECTION</text>
    <text x="70" y="980" fill="#c3ccea" font-size="16">Long-exposure city/data at night · clean architectural lines · a single lit element in a dark field ·</text>
    <text x="70" y="1004" fill="#c3ccea" font-size="16">macro of a coin/contact-point · NO crypto-bro neon, NO cartoon robots. Restraint = credibility.</text>
  </g>
</svg>
